name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 组装站点（排除开发脚本与依赖）
        run: |
          mkdir -p .publish
          cp -R index.html resume.pdf .nojekyll README.md assets .publish/
          du -sh .publish && find .publish -type f | sort

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .publish

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
